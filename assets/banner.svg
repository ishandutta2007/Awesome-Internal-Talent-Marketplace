<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    
    .node-1 { animation: float1 6s ease-in-out infinite; }
    .node-2 { animation: float2 8s ease-in-out infinite; }
    .pulse-bg { animation: pulse 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg)" rx="16"/>
  
  <!-- Dynamic Background Circles -->
  <circle cx="150" cy="80" r="180" fill="#4f46e5" class="pulse-bg" filter="blur(60px)"/>
  <circle cx="1050" cy="270" r="160" fill="#c026d3" class="pulse-bg" filter="blur(60px)"/>

  <!-- Background Tech Graph Network (Dynamic Behind Foreground) -->
  <g opacity="0.25" class="node-2">
    <line x1="100" y1="280" x2="250" y2="220" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="250" y1="220" x2="400" y2="290" stroke="#a855f7" stroke-width="2"/>
    <line x1="900" y1="80" x2="1050" y2="140" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="100" cy="280" r="6" fill="#6366f1"/>
    <circle cx="250" cy="220" r="8" fill="#a855f7"/>
    <circle cx="400" cy="290" r="5" fill="#ec4899"/>
    <circle cx="900" cy="80" r="7" fill="#6366f1"/>
    <circle cx="1050" cy="140" r="9" fill="#a855f7"/>
  </g>

  <!-- Dynamic Floating Decorative Cards (Positioned lower/side so text stays on top) -->
  <g class="node-1">
    <rect x="80" y="240" width="180" height="60" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="100" y="275" class="badge-text" fill="#a855f7">🎯 Skills Matching</text>
  </g>
  
  <g class="node-2">
    <rect x="940" y="50" width="190" height="60" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="960" y="85" class="badge-text" fill="#ec4899">🚀 Workforce Agility</text>
  </g>

  <!-- Main Accent Header Line -->
  <rect x="80" y="75" width="80" height="6" rx="3" fill="url(#accent)"/>

  <!-- Main Text Elements (Foreground) -->
  <text x="80" y="135" class="title">Awesome Internal Talent Marketplace</text>
  <text x="80" y="175" class="subtitle">Curated Ecosystem of SaaS Platforms, Open-Source Repos &amp; HR Tech Tools</text>

  <!-- Feature Pills (Foreground Bottom) -->
  <g transform="translate(80, 210)">
    <rect x="0" y="0" width="170" height="36" rx="18" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.4"/>
    <text x="20" y="23" class="badge-text">💼 Career Mobility</text>

    <rect x="185" y="0" width="180" height="36" rx="18" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="205" y="23" class="badge-text">⚡ Gig &amp; Project Matching</text>

    <rect x="380" y="0" width="165" height="36" rx="18" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-opacity="0.4"/>
    <text x="400" y="23" class="badge-text">📊 Skills Intelligence</text>
  </g>
</svg>
